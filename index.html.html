<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Энциклопедия упражнений ВПС — SAYAN REHAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-green: #3D8B5E;
            --color-green-light: #5AB07A;
            --color-green-dark: #2D6B4A;
            --color-bg: #F8F8F3;
            --color-white: #FFFFFF;
            --color-text: #1A1A1A;
            --color-text-light: #666666;
            --color-border: #E5E5E5;
            --color-accent-m1: #FF9800;
            --color-accent-m2: #4CAF50;
            --color-accent-m3: #2196F3;
            --color-accent-m4: #9C27B0;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            background-image: url("image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            color: var(--color-text);
            line-height: 1.6;
        }

        /* HEADER */
        .header {
            background: var(--color-white);
            border-bottom: 3px solid var(--color-green);
            padding: 50px 20px 40px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-family: var(--font-heading);
            font-size: clamp(48px, 8vw, 80px);
            font-weight: 900;
            color: var(--color-green);
            line-height: 0.9;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 18px;
            color: var(--color-text-light);
            font-weight: 500;
            max-width: 600px;
            margin: 0 auto;
        }

        .meta-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--color-text-light);
        }

        .meta-info span {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--color-bg);
            border-radius: 20px;
            font-weight: 500;
        }

        /* CONTAINER */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* FILTERS */
        .filters-section {
            background: var(--color-white);
            padding: 30px;
            border-radius: var(--radius);
            margin-bottom: 40px;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .filters-title {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 700;
        }

        .exercises-count {
            background: var(--color-green);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid var(--color-border);
            border-radius: 30px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--color-text);
        }

        .filter-btn:hover {
            border-color: var(--color-green);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .filter-btn.active {
            background: var(--color-green);
            border-color: var(--color-green);
            color: white;
        }

        .filter-btn[data-filter="m1"].active { background: var(--color-accent-m1); border-color: var(--color-accent-m1); }
        .filter-btn[data-filter="m2"].active { background: var(--color-accent-m2); border-color: var(--color-accent-m2); }
        .filter-btn[data-filter="m3"].active { background: var(--color-accent-m3); border-color: var(--color-accent-m3); }
        .filter-btn[data-filter="m4"].active { background: var(--color-accent-m4); border-color: var(--color-accent-m4); }

        /* EXERCISES GRID */
        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .exercise-card {
            background: var(--color-white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .exercise-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--color-green);
        }

        .exercise-header {
            padding: 25px;
            position: relative;
            background: linear-gradient(135deg, rgba(61, 139, 94, 0.05) 0%, rgba(61, 139, 94, 0.02) 100%);
            border-bottom: 1px solid var(--color-border);
        }

        .exercise-module-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .exercise-module-badge.m1 { background: rgba(255, 152, 0, 0.15); color: #E65100; }
        .exercise-module-badge.m2 { background: rgba(76, 175, 80, 0.15); color: #1B5E20; }
        .exercise-module-badge.m3 { background: rgba(33, 150, 243, 0.15); color: #0D47A1; }
        .exercise-module-badge.m4 { background: rgba(156, 39, 176, 0.15); color: #4A148C; }

        .exercise-number {
            font-family: var(--font-heading);
            font-size: 14px;
            color: var(--color-green);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .exercise-title {
            font-family: var(--font-heading);
            font-size: 22px;
            font-weight: 700;
            color: var(--color-text);
            line-height: 1.3;
        }

        .exercise-body {
            padding: 25px;
        }

        .exercise-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--color-text-light);
            padding: 6px 12px;
            background: var(--color-bg);
            border-radius: 6px;
            font-weight: 500;
        }

        .meta-item svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .exercise-description {
            font-size: 14px;
            color: var(--color-text-light);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .exercise-details {
            border-top: 1px solid var(--color-border);
            padding-top: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .detail-label {
            font-weight: 600;
            color: var(--color-text);
            min-width: 120px;
        }

        .detail-value {
            color: var(--color-text-light);
            text-align: right;
            flex: 1;
        }

        .view-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            color: var(--color-green);
            font-weight: 600;
            font-size: 14px;
            transition: gap 0.3s ease;
        }

        .exercise-card:hover .view-more {
            gap: 12px;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: var(--color-white);
            border-radius: var(--radius);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--color-bg);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--color-text);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--color-green);
            color: white;
            transform: rotate(90deg);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--color-green) 0%, var(--color-green-dark) 100%);
            color: white;
            padding: 50px 40px 40px;
            position: relative;
        }

        .modal-module {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .modal-title {
            font-family: var(--font-heading);
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .modal-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
            opacity: 0.95;
        }

        .modal-body {
            padding: 40px;
        }

        .modal-section {
            margin-bottom: 35px;
        }

        .modal-section-title {
            font-family: var(--font-heading);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--color-green);
            border-radius: 2px;
        }

        .modal-section-content {
            color: var(--color-text-light);
            line-height: 1.8;
            font-size: 15px;
        }

        .steps-list {
            list-style: none;
            counter-reset: step-counter;
        }

        .steps-list li {
            counter-increment: step-counter;
            padding-left: 50px;
            margin-bottom: 20px;
            position: relative;
        }

        .steps-list li::before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 0;
            width: 36px;
            height: 36px;
            background: var(--color-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .tips-box {
            background: linear-gradient(135deg, rgba(61, 139, 94, 0.08) 0%, rgba(61, 139, 94, 0.03) 100%);
            border-left: 4px solid var(--color-green);
            padding: 20px 25px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-top: 20px;
        }

        .tips-box strong {
            color: var(--color-text);
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .tips-box ul {
            margin-left: 20px;
        }

        .tips-box li {
            margin-bottom: 6px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .exercises-grid {
                grid-template-columns: 1fr;
            }
            .modal-header {
                padding: 40px 25px 30px;
            }
            .modal-title {
                font-size: 26px;
            }
            .modal-body {
                padding: 25px;
            }
            .filters {
                justify-content: center;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-green);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-green-dark);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exercise-card {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>

        <div class="exercises-grid" id="exercisesGrid">
            <!-- Exercises will be inserted here by JavaScript -->

            const countEl = document.getElementById('exerciseCount');
            grid.innerHTML = '';

            const filtered = filter === 'all' 
                ? exercises 
                : exercises.filter(ex => ex.module === filter);

            countEl.textContent = `Показано: ${filtered.length} упражнений`;

            filtered.forEach(ex => {
                const card = createExerciseCard(ex);
                grid.appendChild(card);
            });
        }

        function createExerciseCard(exercise) {
            const card = document.createElement('div');
            card.className = 'exercise-card';
            card.onclick = () => openModal(exercise);

            const moduleColors = {
                m1: 'var(--color-accent-m1)',
                m2: 'var(--color-accent-m2)',
                m3: 'var(--color-accent-m3)',
                m4: 'var(--color-accent-m4)'
            };

            card.innerHTML = `
                <div class="exercise-header">
                    <span class="exercise-module-badge ${exercise.module}">${exercise.moduleName}</span>
                    <div class="exercise-number">Упражнение #${exercise.id}</div>
                    <h3 class="exercise-title">${exercise.title}</h3>
                </div>
                <div class="exercise-body">
                    <div class="exercise-meta">
                        <div class="meta-item">⏱️ ${exercise.duration}</div>
                        <div class="meta-item">📊 ${exercise.difficulty}</div>
                        <div class="meta-item">🎯 ${exercise.equipment}</div>
                    </div>
                    <p class="exercise-description">${exercise.description}</p>
                    <div class="exercise-details">
                        <div class="detail-row">
                            <span class="detail-label">Целевые мышцы:</span>
                            <span class="detail-value">${exercise.target}</span>
                        </div>
                    </div>
                    <div class="view-more">
                        Подробнее →
                    </div>
                </div>
            `;

            return card;
        }

        // Modal functions
        function openModal(exercise) {
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');

            const stepsHtml = exercise.steps.map((step, index) => 
                `<li>${step}</li>`
            ).join('');

            content.innerHTML = `
                <div class="modal-header" style="background: linear-gradient(135deg, ${getModuleColor(exercise.module)} 0%, ${getModuleColorDark(exercise.module)} 100%);">
                    <span class="modal-module">${exercise.moduleName}</span>
                    <h2 class="modal-title">${exercise.title}</h2>
                    <div class="modal-meta">
                        <span>⏱️ ${exercise.duration}</span>
                        <span>📊 ${exercise.difficulty}</span>
                        <span>🎯 ${exercise.equipment}</span>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="modal-section">
                        <h3 class="modal-section-title">Описание</h3>
                        <div class="modal-section-content">${exercise.description}</div>
                    </div>
                    
                    <div class="modal-section">
                        <h3 class="modal-section-title">Целевые мышцы</h3>
                        <div class="modal-section-content">${exercise.target}</div>
                    </div>

                    <div class="modal-section">
                        <h3 class="modal-section-title">Техника выполнения</h3>
                        <ol class="steps-list">
                            ${stepsHtml}
                        </ol>
                    </div>

                    <div class="tips-box">
                        <strong>💡 Рекомендации:</strong>
                        ${exercise.tips}
                    </div>

                    <div class="tips-box" style="margin-top: 15px; border-left-color: #f44336; background: linear-gradient(135deg, rgba(244, 67, 54, 0.08) 0%, rgba(244, 67, 54, 0.03) 100%);">
                        <strong>⚠️ Частые ошибки:</strong>
                        ${exercise.mistakes}
                    </div>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (!event || event.target.id === 'modalOverlay' || event.target.className === 'modal-close') {
                const modal = document.getElementById('modalOverlay');
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        function getModuleColor(module) {
            const colors = {
                m1: '#FF9800',
                m2: '#4CAF50',
                m3: '#2196F3',
                m4: '#9C27B0'
            };
            return colors[module] || '#3D8B5E';
        }

        function getModuleColorDark(module) {
            const colors = {
                m1: '#E65100',
                m2: '#1B5E20',
                m3: '#0D47A1',
                m4: '#4A148C'
            };
            return colors[module] || '#2D6B4A';
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderExercises(this.dataset.filter);
            });
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initial render
        renderExercises();
    </script>
</body>
</html>
